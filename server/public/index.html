<style>
:root {
  --accent:#1f6feb; --font:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --radius-card:26px; --radius-btn:16px;
  --screen:#fbfaf7; --screen-2:#f4f1ea; --card:#fff; --card-2:#f7f4ee;
  --ink:#1c1a15; --ink-2:#6f6a5f; --ink-3:#a39d8f;
  --line:#ece7dc; --line-2:#e3ddd0;
  --success:#1f9d57; --danger:#e0524f; --amber:#d98a23;
  --shadow:0 1px 2px rgba(40,33,20,.04),0 8px 24px rgba(40,33,20,.06);
  --shadow-lg:0 24px 60px rgba(40,33,20,.14);
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--card));
  --accent-line:color-mix(in srgb,var(--accent) 24%,var(--card));
  --success-soft:color-mix(in srgb,var(--success) 13%,var(--card));
}
@media(prefers-color-scheme:dark){:root{
  --screen:#16171c;--screen-2:#1b1d23;--card:#1f2128;--card-2:#262932;
  --ink:#f3f1ea;--ink-2:#a8a49a;--ink-3:#6f6d66;
  --line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.12);
  --success:#3ec27a;--danger:#f0716e;--amber:#e7a64a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 30px 70px rgba(0,0,0,.5);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;background:var(--screen-2);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.page{max-width:740px;margin:0 auto;padding:40px 20px 64px}
.logo{display:inline-flex;align-items:center;justify-content:center;border-radius:30%;background:var(--accent);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.card{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow)}
.btn{font-family:var(--font);font-weight:700;font-size:15px;border:0;cursor:pointer;border-radius:var(--radius-btn);padding:0 18px;height:48px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-secondary{background:var(--card-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-secondary:hover{background:color-mix(in srgb,var(--ink) 6%,var(--card-2))}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}
.pill-success{background:var(--success-soft);color:var(--success)}
.pill-waiting{background:color-mix(in srgb,var(--amber) 14%,var(--card));color:var(--amber)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.dot-live{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.muted{color:var(--ink-2)}
.mono{font-family:var(--mono)}
.prog-wrap{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);margin:8px 0 0}
.prog-bar{height:100%;border-radius:99px;background:var(--accent);background-image:linear-gradient(90deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));transition:width .2s linear;width:0}
.prog-bar.done{background:var(--success);background-image:none}
.fic{border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
/* header */
.hdr{display:flex;align-items:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.hdr-text h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.hdr-text .sub{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* zip card */
.zip-card{margin-top:24px;padding:18px 20px;display:flex;align-items:center;gap:16px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);border-radius:var(--radius-card)}
.zip-icon{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* file list */
.file-list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.file-row{padding:14px 18px;display:flex;align-items:center;gap:14px}
.file-info{flex:1;min-width:0}
.file-name{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}
.pct{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--accent);width:52px;text-align:right;flex-shrink:0}
/* status bar */
.status-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
/* footer */
.footer{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
/* waiting */
.waiting{text-align:center;padding:60px 20px;color:var(--ink-2)}
.waiting h2{font-size:20px;font-weight:800;color:var(--ink);margin:16px 0 8px}
.spinner{width:48px;height:48px;border:3px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page" id="root">
  <div class="waiting"><div class="spinner"></div><h2>Łączenie z telefonem…</h2><p>Upewnij się, że aplikacja DirectDrop jest otwarta i aktywna.</p></div>
</div>

const FTYPE = {
  video:{hue:266},image:{hue:28},map:{hue:150},music:{hue:332},doc:{hue:212},file:{hue:212}
};

function fmtBytes(b) {
  if(b>=1e9) return (b/1e9).toFixed(b/1e9>=10?0:2)+' GB';
  if(b>=1e6) return (b/1e6).toFixed(b/1e6>=10?0:1)+' MB';
  if(b>=1e3) return Math.round(b/1e3)+' KB';
  return b+' B';
}

function isDark() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function ficStyle(type,size=46) {
  const h = (FTYPE[type]||FTYPE.file).hue;
  const dark = isDark();
  const bg = dark ? `oklch(0.32 0.05 ${h})` : `oklch(0.93 0.06 ${h})`;
  const fg = dark ? `oklch(0.82 0.12 ${h})` : `oklch(0.52 0.16 ${h})`;
  return `width:${size}px;height:${size}px;background:${bg};color:${fg}`;
}

  zip:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M14 2v5h5"/><path d="M11 8h1.5M11 11h1.5M11 14h1.5"/></svg>`,
  phone:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>`,
  video:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/></svg>`,
  image:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M5 17l4.5-4.5 4 3.5L17 11l3 3"/></svg>`,
  map:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg>`,
  music:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="2.6"/><circle cx="18" cy="15" r="2.6"/><path d="M9.6 17V6l11-2v11"/></svg>`,
  doc:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h6"/></svg>`,
  file:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>`,
};
const typeIcon = t => icons[t] || icons.file;

// Logo — PNG icon
function logoSVG(size=46) {
  const r = Math.round(size*0.3);
  return `<img src="data:image/png;base64,${ICON_B64}" style="width:${size}px;height:${size}px;border-radius:${r}px;flex-shrink:0;object-fit:cover" alt="DirectDrop">`;
}

// ── state ─────────────────────────────────────────────────────────────────────
const fileState = {}; // name → { progress(0-100), status: queued|active|done, removed: bool }
let currentInfo = null;
let shutdownShown = false;

// ── render ────────────────────────────────────────────────────────────────────
function render(info) {
  const root = document.getElementById('root');
  if (!info.connected || !info.files.length) {
    root.innerHTML = `
      <div class="waiting">
        <div class="spinner"></div>
        <h2>Oczekiwanie na telefon…</h2>
        <p>Otwórz aplikację DirectDrop na telefonie, wybierz pliki i wciśnij <strong>Udostępnij</strong>.</p>
      </div>`;
    return;
  }

  const total = info.files.reduce((s,f)=>s+f.size,0);

  // init file state for new files
  info.files.forEach(f => {
    if (!fileState[f.name]) fileState[f.name] = { progress:0, status:'queued' };
  });

  const visibleFiles = info.files.filter(f => !fileState[f.name]?.removed);
  const allRemoved   = info.files.length > 0 && visibleFiles.length === 0;

  const filesHtml = allRemoved
    ? `<div style="text-align:center;padding:48px 16px">
        <div style="font-size:44px;line-height:1;margin-bottom:12px;color:#1f9d57">✓</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:6px">Wszystkie pliki pobrane!</div>
        <div style="font-size:13px;opacity:.6">Transfer zakończony pomyślnie</div>
       </div>`
    : visibleFiles.map(f => {
        const st = fileState[f.name] || { progress:0, status:'queued' };
        const done   = st.status === 'done';
        const active = st.status === 'active';
        const progressHtml = (active || done) ? `
          <div class="prog-wrap"><div class="prog-bar${done?' done':''}" id="bar-${CSS.escape(f.name)}" style="width:${st.progress}%"></div></div>` : '';
        const rightHtml = done
          ? `<span class="pill pill-success">${icons.check} Pobrano</span>`
          : active
            ? `<span class="pct" id="pct-${CSS.escape(f.name)}">${Math.round(st.progress)}%</span>`
            : `<button class="btn btn-secondary" onclick="downloadOne(${JSON.stringify(f.name)},${f.size})">${icons.download} Pobierz</button>`;

        return `<div class="card file-row" id="frow-${CSS.escape(f.name)}" style="transition:opacity .45s,transform .45s">
          <div class="fic" style="${ficStyle(f.type)}">${typeIcon(f.type)}</div>
          <div class="file-info">
            <div class="file-name">${esc(f.name)}</div>
            <div class="file-size mono">${fmtBytes(f.size)}</div>
            ${progressHtml}
          </div>
          ${rightHtml}
        </div>`;
      }).join('');

  const allDone = info.files.every(f => (fileState[f.name]||{}).status === 'done');

  root.innerHTML = `
    <div class="hdr">
      ${logoSVG(46)}
      <div class="hdr-text" style="flex:1;min-width:0">
        <h1>Pliki z telefonu</h1>
        <div class="sub">
          <span style="display:flex;align-items:center;gap:6px">${icons.phone} ${info.clients} urządzeń połączonych</span>
          <span style="color:var(--line-2)">·</span>
          <span class="mono">${info.files.length} plików · ${fmtBytes(total)}</span>
        </div>
      </div>
      <span class="pill ${info.connected?'pill-success':'pill-waiting'}">
        <span class="dot${info.connected?' dot-live':''}"></span>
        ${info.connected?'Połączono':'Oczekiwanie'}
      </span>
    </div>

    <div class="zip-card">
      <div class="zip-icon">${icons.zip}</div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px">Pobierz wszystko jako ZIP</div>
        <div class="muted" style="font-size:13.5px;font-weight:500;margin-top:2px">Jedno archiwum · ${fmtBytes(total)}</div>
      </div>
      ${allDone
        ? `<span class="pill pill-success">${icons.check} Pobrano</span>`
        : `<button class="btn btn-primary" onclick="downloadAll()">${icons.download} Pobierz wszystko</button>`}
    </div>

    <div style="margin-top:18px">
      <div class="eyebrow" style="margin-bottom:12px">Pliki</div>
      <div class="file-list">${filesHtml}</div>
    </div>

    <div class="footer">${icons.shield} Transfer odbywa się wyłącznie w Twojej sieci lokalnej. Nic nie trafia do chmury. &nbsp;·&nbsp; DirectDrop V0.14 &nbsp;·&nbsp; Created by Tomasz Pieczara</div>
  `;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── download helpers ──────────────────────────────────────────────────────────
async function streamDownload(url, filename, size, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.statusText);

  const reader = res.body.getReader();
  let received = 0;
  const chunks = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    onProgress(Math.round(received / size * 100));
  }

  // trigger browser download
  const blob = new Blob(chunks);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function downloadOne(name, size) {
  fileState[name] = { progress: 0, status: 'active' };
  render(currentInfo);
  try {
    await streamDownload(
      `/api/download/${encodeURIComponent(name)}`,
      name, size,
      pct => {
        fileState[name].progress = pct;
        updateBar(name, pct, false);
      }
    );
    fileState[name] = { progress: 100, status: 'done' };
    render(currentInfo);
    scheduleRowRemoval(name);
  } catch {
    fileState[name] = { progress: 0, status: 'queued' };
    render(currentInfo);
  }
}

function scheduleRowRemoval(name) {
  setTimeout(() => {
    const row = document.getElementById('frow-' + CSS.escape(name));
    if (row) {
      row.style.opacity = '0';
      row.style.transform = 'translateY(-6px)';
      setTimeout(() => {
        fileState[name].removed = true;
        render(currentInfo);
      }, 460);
    } else {
      fileState[name].removed = true;
      render(currentInfo);
    }
  }, 900);
}

async function downloadAll() {
  const files = currentInfo?.files || [];
  files.forEach(f => { fileState[f.name] = { progress: 0, status: 'active' }; });
  render(currentInfo);

  try {
    const res = await fetch('/api/download-all');
    if (!res.ok) throw new Error(res.statusText);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'DirectDrop.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    files.forEach(f => { fileState[f.name] = { progress: 100, status: 'done' }; });
    render(currentInfo);
    setTimeout(() => {
      files.forEach(f => {
        const row = document.getElementById('frow-' + CSS.escape(f.name));
        if (row) { row.style.opacity = '0'; row.style.transform = 'translateY(-6px)'; }
      });
      setTimeout(() => {
        files.forEach(f => { fileState[f.name].removed = true; });
        render(currentInfo);
      }, 460);
    }, 900);
  } catch {
    files.forEach(f => { fileState[f.name] = { progress: 0, status: 'queued' }; });
    render(currentInfo);
  }
}

function updateBar(name, pct, done) {
  const bar = document.getElementById('bar-' + CSS.escape(name));
  const pctEl = document.getElementById('pct-' + CSS.escape(name));
  if (bar) { bar.style.width = pct + '%'; if (done) bar.classList.add('done'); }
  if (pctEl) pctEl.textContent = pct + '%';
}

// ── shutdown screen ───────────────────────────────────────────────────────────
function showShutdown() {
  if (shutdownShown) return;
  shutdownShown = true;
  document.getElementById('root').innerHTML = `
    <div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:0">
      ${logoSVG(80)}
      <div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px">DirectDrop</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--ink-2)">Serwer wyłączony</div>
      <div style="font-size:14px;max-width:280px;line-height:1.55;color:var(--ink-3)">Transfer zakończony. Do następnego razu! :)</div>
    </div>`;
}

// ── polling ───────────────────────────────────────────────────────────────────
let failCount = 0;
async function poll() {
  if (shutdownShown) return;
  try {
    const info = await fetch('/api/info').then(r => r.json());
    failCount = 0;
    if (info.stopped) { showShutdown(); return; }
    currentInfo = info;
    render(info);
  } catch {
    failCount++;
    if (failCount >= 2) { showShutdown(); return; }
  }
  setTimeout(poll, 2000);
}

poll();
</script>
