<style>
:root {
  --accent: #1f6feb;
  --radius-card: 26px;
  --radius-btn: 16px;
  --radius-sm: 12px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
[data-theme="light"] {
  --screen: #fbfaf7; --screen-2: #f4f1ea; --card: #ffffff; --card-2: #f7f4ee;
  --ink: #1c1a15; --ink-2: #6f6a5f; --ink-3: #a39d8f;
  --line: #ece7dc; --line-2: #e3ddd0;
  --success: #1f9d57; --danger: #e0524f; --amber: #d98a23;
  --shadow: 0 1px 2px rgba(40,33,20,.04), 0 8px 24px rgba(40,33,20,.06);
  --shadow-lg: 0 24px 60px rgba(40,33,20,.14);
  --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--card));
  --accent-line: color-mix(in srgb, var(--accent) 24%, var(--card));
  --success-soft: color-mix(in srgb, var(--success) 13%, var(--card));
  --danger-soft: color-mix(in srgb, var(--danger) 13%, var(--card));
  --amber-soft: color-mix(in srgb, var(--amber) 15%, var(--card));
}
[data-theme="dark"] {
  --screen: #16171c; --screen-2: #1b1d23; --card: #1f2128; --card-2: #262932;
  --ink: #f3f1ea; --ink-2: #a8a49a; --ink-3: #6f6d66;
  --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.12);
  --success: #3ec27a; --danger: #f0716e; --amber: #e7a64a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-lg: 0 30px 70px rgba(0,0,0,.5);
  --accent-soft: color-mix(in srgb, var(--accent) 22%, var(--card));
  --accent-line: color-mix(in srgb, var(--accent) 40%, var(--card));
  --success-soft: color-mix(in srgb, var(--success) 20%, var(--card));
  --danger-soft: color-mix(in srgb, var(--danger) 20%, var(--card));
  --amber-soft: color-mix(in srgb, var(--amber) 22%, var(--card));
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: radial-gradient(1100px 700px at 18% -8%, color-mix(in srgb, var(--accent) 12%, #efece4) 0%, transparent 55%),
              radial-gradient(900px 700px at 100% 110%, #efe9dd 0%, transparent 60%), #ece7db;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.stage-dark {
  background: radial-gradient(1100px 700px at 18% -8%, color-mix(in srgb, var(--accent) 26%, #0c0d11) 0%, transparent 55%),
              radial-gradient(900px 700px at 100% 110%, #0e0f13 0%, transparent 60%), #0a0b0e;
}
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.stage-top {
  width: 100%; max-width: 1180px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 26px 28px 6px; flex-wrap: wrap;
}
.brandlock { display: flex; align-items: center; gap: 11px; }
.brandlock .nm { font-weight: 800; font-size: 17px; letter-spacing: -.02em; color: #211d14; }
.stage-dark .brandlock .nm { color: #f3f1ea; }
.brandlock .sub { font-size: 12.5px; color: #7d7666; font-weight: 500; }
.stage-dark .brandlock .sub { color: #8d887d; }
.seg {
  display: flex; background: rgba(255,255,255,.6); border: 1px solid rgba(40,33,20,.08);
  padding: 4px; border-radius: 13px; gap: 3px; backdrop-filter: blur(8px);
}
.stage-dark .seg { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.09); }
.seg button {
  border: 0; background: transparent; font-family: var(--font); font-weight: 600; font-size: 13px;
  color: #6f6a5f; padding: 7px 15px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; gap: 7px; transition: .18s;
}
.stage-dark .seg button { color: #a8a49a; }
.seg button.on { background: #fff; color: #1c1a15; box-shadow: 0 1px 3px rgba(40,33,20,.12); }
.stage-dark .seg button.on { background: #2a2d36; color: #f3f1ea; }
.stage-body { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 20px 40px; }
.phone {
  width: 404px; height: 812px; border-radius: 44px; padding: 9px; position: relative;
  background: linear-gradient(160deg,#3a3a3a,#101010);
  box-shadow: var(--shadow-lg), inset 0 0 0 2px rgba(255,255,255,.06);
}
.phone-screen {
  width: 100%; height: 100%; border-radius: 38px; overflow: hidden; position: relative;
  background: var(--screen); display: flex; flex-direction: column;
}
.statusbar {
  height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; font-size: 14px; font-weight: 700; color: var(--ink); position: relative; z-index: 5;
}
.statusbar .punch {
  position: absolute; left: 50%; top: 11px; transform: translateX(-50%);
  width: 11px; height: 11px; border-radius: 50%; background: #0a0a0a;
}
.statusbar .sb-r { display: flex; align-items: center; gap: 7px; }
.navpill { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.navpill i { width: 128px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .32; display: block; }
.screen-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.screen-scroll::-webkit-scrollbar { width: 0; }
.view-anim { animation: viewIn .42s cubic-bezier(.22,1,.36,1); }
@keyframes viewIn { from { transform: translateY(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .view-anim { animation: none; } }
.btn {
  font-family: var(--font); font-weight: 700; font-size: 16px; border: 0; cursor: pointer;
  border-radius: var(--radius-btn); padding: 0 20px; height: 54px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .12s, background .18s, box-shadow .18s, opacity .18s;
  letter-spacing: -.01em; white-space: nowrap;
}
.btn:active { transform: scale(.975); }
.btn--block { width: 100%; }
.btn--primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb,var(--accent) 38%,transparent); }
.btn--primary:hover { filter: brightness(1.05); }
.btn--secondary { background: var(--card-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn--secondary:hover { background: color-mix(in srgb,var(--ink) 6%,var(--card-2)); }
.btn--danger { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in srgb,var(--danger) 30%,transparent); }
.btn--danger:hover { background: color-mix(in srgb,var(--danger) 20%,var(--card)); }
.btn--ghost { background: transparent; color: var(--accent); height: 48px; }
.btn--ghost:hover { background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn {
  width: 42px; height: 42px; border-radius: 13px; border: 0; background: var(--card-2); color: var(--ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  transition: .15s; box-shadow: inset 0 0 0 1px var(--line);
}
.iconbtn:hover { background: color-mix(in srgb,var(--ink) 7%,var(--card-2)); }
.iconbtn:active { transform: scale(.92); }
.card { background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow); }
.pill {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px;
  padding: 8px 14px; border-radius: 999px; letter-spacing: -.01em;
}
.pill--success { background: var(--success-soft); color: var(--success); }
.pill--amber { background: var(--amber-soft); color: var(--amber); }
.pill--accent { background: var(--accent-soft); color: var(--accent); }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.pill--live .dot { animation: livePulse 1.4s infinite; }
@keyframes livePulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb,currentColor 55%,transparent); }
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); line-height: 1.08; }
.h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.muted { color: var(--ink-2); }
.mono { font-family: var(--mono); }
.fic {
  width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.frow {
  display: flex; align-items: center; gap: 14px; padding: 13px 14px;

}
.frow .meta { flex: 1; min-width: 0; }
.frow .nm { font-weight: 700; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.frow .sz { font-size: 13px; color: var(--ink-2); font-weight: 500; margin-top: 1px; }
.prog { height: 9px; border-radius: 99px; background: var(--card-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.prog > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .25s linear; background-image: linear-gradient(90deg, color-mix(in srgb,var(--accent) 80%,#fff) 0%, var(--accent) 100%); }
.prog.is-done > i { background: var(--success); background-image: none; }
.stats { display: flex; gap: 10px; }
.stat { flex: 1; background: var(--card-2); border-radius: 18px; padding: 14px 12px; text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
.stat .v { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; font-family: var(--mono); white-space: nowrap; }
.stat .k { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-top: 3px; letter-spacing: .01em; }
.addr { display: flex; align-items: center; gap: 10px; background: var(--card-2); border-radius: 16px; padding: 12px 12px 12px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.addr .url { flex: 1; font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast {
  position: absolute; left: 16px; right: 16px; top: 14px; z-index: 30;
  background: var(--ink); color: var(--screen); border-radius: 18px; padding: 13px 16px;
  display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.28);
  animation: toastIn .4s cubic-bezier(.22,1,.36,1);
}
.toast .t { font-weight: 700; font-size: 14px; }
.toast .s { font-size: 12.5px; opacity: .7; font-weight: 500; }
@keyframes toastIn { from { transform: translateY(-14px); } to { transform: none; } }
.bottombar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--screen) 72%, transparent);
}
.bottombar .row { display: flex; align-items: center; gap: 14px; }
.logo {
  display: flex; align-items: center; justify-content: center; border-radius: 30%;
  background: var(--accent); box-shadow: 0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);
}
.qrbox {
  background: #fff; border-radius: 24px; padding: 20px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(40,33,20,.12), inset 0 0 0 1px rgba(0,0,0,.04);
}
.checkring {
  width: 108px; height: 108px; border-radius: 50%; background: var(--success-soft);
  display: flex; align-items: center; justify-content: center; margin: 0 auto; position: relative;
}
.checkring::before, .checkring::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid var(--success); }
.checkring::before { inset: -12px; opacity: .18; }
.checkring::after { inset: -24px; opacity: .08; }
.checkring .core {
  width: 72px; height: 72px; border-radius: 50%; background: var(--success);
  display: flex; align-items: center; justify-content: center;
  animation: pop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop { from { transform: scale(.5); } to { transform: scale(1); } }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); white-space: nowrap; background: var(--card-2);
  padding: 7px 12px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line);
}
.browser {
  width: 1060px; max-width: 94vw; height: 712px; max-height: 84vh; border-radius: 16px;
  overflow: hidden; background: var(--card); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
}
.bw-bar {
  height: 48px; background: var(--screen-2); display: flex; align-items: center; gap: 14px;
  padding: 0 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.bw-lights { display: flex; gap: 8px; }
.bw-lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.bw-url {
  flex: 1; height: 30px; background: var(--card); border-radius: 9px;
  display: flex; align-items: center; gap: 9px; padding: 0 13px;
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  box-shadow: inset 0 0 0 1px var(--line); max-width: 480px;
}
.bw-body { flex: 1; overflow-y: auto; background: var(--screen); }
.dl-wrap { max-width: 720px; margin: 0 auto; padding: 48px 32px 56px; }
@media (max-width: 520px) { .phone { transform: scale(.88); transform-origin: top center; } }
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ── helpers ── */
function fmtBytes(b) {
  if (b >= 1e9) return (b/1e9).toFixed(b/1e9 >= 10 ? 0 : 2) + ' GB';
  if (b >= 1e6) return (b/1e6).toFixed(b/1e6 >= 10 ? 0 : 1) + ' MB';
  if (b >= 1e3) return Math.round(b/1e3) + ' KB';
  return b + ' B';
}
function fmtSpeed(mbs) { return mbs.toFixed(mbs >= 10 ? 0 : 1) + ' MB/s'; }
function fmtTime(s) {
  if (s == null || !isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' s';
  const m = Math.floor(s/60), r = s%60;
  return m + ' min' + (r ? ' ' + r + ' s' : '');
}

/* ── icons ── */
function Icon({ name, size=24, stroke=2, style, className }) {
  const p = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor',
    strokeWidth:stroke, strokeLinecap:'round', strokeLinejoin:'round', style, className };
  const paths = {
    upload:   <><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></>,
    folder:   <><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></>,
    arrowR:   <><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></>,
    back:     <><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></>,
    plus:     <><path d="M12 5v14"/><path d="M5 12h14"/></>,
    x:        <><path d="M6 6l12 12"/><path d="M18 6L6 18"/></>,
    copy:     <><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></>,
    check:    <><path d="M5 12.5l4.5 4.5L19 7"/></>,
    stop:     <><rect x="6" y="6" width="12" height="12" rx="3"/></>,
    wifi:     <><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><path d="M12 19h.01"/></>,
    monitor:  <><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></>,
    phone:    <><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></>,
    shield:   <><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></>,
    download: <><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></>,
    zip:      <><path d="M5 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M14 2v5h5"/><path d="M11 8h1.5M11 11h1.5M11 14h1.5"/></>,
    video:    <><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/></>,
    image:    <><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M5 17l4.5-4.5 4 3.5L17 11l3 3"/></>,
    map:      <><path d="M9 4L3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></>,
    music:    <><circle cx="7" cy="17" r="2.6"/><circle cx="18" cy="15" r="2.6"/><path d="M9.6 17V6l11-2v11"/></>,
    file:     <><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></>,
    doc:      <><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h6"/></>,
    bolt:     <><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></>,
    clock:    <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    sun:      <><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></>,
    moon:     <><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></>,
    link:     <><path d="M9 13a4 4 0 0 0 6 0l2-2a4 4 0 0 0-6-6l-1 1"/><path d="M15 11a4 4 0 0 0-6 0l-2 2a4 4 0 0 0 6 6l1-1"/></>,
    users:    <><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 19a5.5 5.5 0 0 0-3-4.9"/></>,
  };
  return <svg {...p}>{paths[name] || null}</svg>;
}

/* ── file icon ── */
const FTYPE = {
  video: { icon:'video', hue:266 }, image: { icon:'image', hue:28 },
  map:   { icon:'map',   hue:150 }, music: { icon:'music', hue:332 },
  doc:   { icon:'doc',   hue:212 }, file:  { icon:'file',  hue:212 },
};
function extType(name) {
  const e = (name.split('.').pop() || '').toLowerCase();
  if (['mp4','mov','mkv','avi','webm','m4v'].includes(e)) return 'video';
  if (['jpg','jpeg','png','heic','webp','gif','raw','dng'].includes(e)) return 'image';
  if (['gpx','kml','geojson'].includes(e)) return 'map';
  if (['mp3','wav','flac','m4a','aac'].includes(e)) return 'music';
  if (['pdf','doc','docx','txt','zip','csv'].includes(e)) return 'doc';
  return 'file';
}
function FileIcon({ type, size=48, dark }) {
  const t = FTYPE[type] || FTYPE.file;
  const bg = dark ? `oklch(0.32 0.05 ${t.hue})` : `oklch(0.93 0.06 ${t.hue})`;
  const fg = dark ? `oklch(0.82 0.12 ${t.hue})` : `oklch(0.52 0.16 ${t.hue})`;
  return (
    <div className="fic" style={{ width:size, height:size, background:bg, color:fg }}>
      <Icon name={t.icon} size={size*0.5} stroke={2} />
    </div>
  );
}

/* ── button ── */
function Btn({ variant='primary', block, children, icon, iconAfter, ...rest }) {
  return (
    <button className={`btn btn--${variant}${block ? ' btn--block' : ''}`} {...rest}>
      {icon && <Icon name={icon} size={20} />}
      {children}
      {iconAfter && <Icon name={iconAfter} size={20} />}
    </button>
  );
}

/* ── QR ── */
function QR({ text, size=188, fg='#15130e' }) {
  const cells = useMemo(() => {
    try {
      const qr = qrcode(0, 'M');
      qr.addData(text); qr.make();
      const n = qr.getModuleCount(), arr = [];
      for (let r=0; r<n; r++) for (let c=0; c<n; c++) if (qr.isDark(r,c)) arr.push([r,c]);
      return { n, arr };
    } catch(e) { return { n:21, arr:[] }; }
  }, [text]);
  const { n, arr } = cells;
  const unit = size / n;
  const isFinder = (r,c) => (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  const eye = (R,C) => (
    <g key={`e${R}${C}`}>
      <rect x={C*unit} y={R*unit} width={7*unit} height={7*unit} rx={2.4*unit} fill={fg}/>
      <rect x={(C+1)*unit} y={(R+1)*unit} width={5*unit} height={5*unit} rx={1.7*unit} fill="#fff"/>
      <rect x={(C+2)*unit} y={(R+2)*unit} width={3*unit} height={3*unit} rx={1*unit} fill={fg}/>
    </g>
  );
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      {arr.filter(([r,c]) => !isFinder(r,c)).map(([r,c],i) =>
        <rect key={i} x={c*unit+unit*.13} y={r*unit+unit*.13} width={unit*.74} height={unit*.74} rx={unit*.3} fill={fg}/>
      )}
      {eye(0,0)}{eye(0,n-7)}{eye(n-7,0)}
    </svg>
  );
}

  const [connected, setConnected] = useState(false);
  const [copied, setCopied] = useState(false);
  const [toast, setToast] = useState(null);
  const [stats, setStats] = useState({ duration:0, avg:NOMINAL });

  const connectTime = useRef(0);
  const durs = useRef({});
  const fileInput = useRef(null);
  const filesRef = useRef(files);
  filesRef.current = files;

  useEffect(() => {
    document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.body.classList.toggle('stage-dark', dark);
  }, [dark]);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', '#1f6feb');
  }, []);

  useEffect(() => { savePrefs({ view, dark }); }, [view, dark]);

  const showToast = o => { setToast(o); setTimeout(() => setToast(null), 2600); };

  const goSelect = () => fileInput.current && fileInput.current.click();
  const onFilesPicked = e => {
    const picked = Array.from(e.target.files || []);
    if (picked.length) setFiles(picked.map(p => mkFile({ name:p.name, size:p.size })));
    setScreen('selection');
    e.target.value = '';
  };
  const useDemoAndSelect = () => { setFiles(DEMO_FILES.map(mkFile)); setScreen('selection'); };
  const removeFile = id => setFiles(fs => fs.filter(f => f.id !== id));

  const startSharing = () => {
    setFiles(fs => fs.map(f => ({ ...f, progress:0, status:'queued', speed:0, eta:null })));
    setConnected(false); setClients(0);
    setScreen('sharing');
  };
  const stopSharing = () => { setConnected(false); setClients(0); setScreen('home'); };

  useEffect(() => {
    if (screen !== 'sharing' || connected) return;
    const id = setTimeout(() => doConnect(), 1800);
    return () => clearTimeout(id);
  }, [screen, connected]);

  const doConnect = () => {
    if (connected) return;
    durs.current = {};
    filesRef.current.forEach((f,i) => {
      durs.current[f.id] = {
        dur: Math.min(9, Math.max(1.2, (f.size/1e6)/NOMINAL)),
        delay: i*.45,
        jitter: .85 + Math.random()*.3
      };
    });
    connectTime.current = performance.now();
    setClients(1); setConnected(true);
    showToast({ icon:'monitor', t:'PC-DESKTOP połączony', s:'Pobieranie rozpoczęte przez przeglądarkę' });
  };

  useEffect(() => {
    if (!connected || screen !== 'sharing') return;
    let raf;
    const tick = () => {
      const now = performance.now();
      setFiles(fs => fs.map(f => {
        const d = durs.current[f.id]; if (!d) return f;
        const el = (now - connectTime.current)/1000 - d.delay;
        if (el <= 0) return { ...f, status:'queued', speed:0, eta:d.dur };
        const p = Math.min(100, (el/d.dur)*100);
        const done = p >= 100;
        return { ...f, progress:p, status:done?'done':'active',
          speed: done ? 0 : (f.size/1e6)/d.dur*d.jitter,
          eta: done ? 0 : (1-p/100)*d.dur };
      }));
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [connected, screen]);

  const allDone = connected && files.length > 0 && files.every(f => f.status === 'done');
  useEffect(() => {
    if (allDone && screen === 'sharing') {
      const duration = (performance.now() - connectTime.current)/1000;
      const totalMB = files.reduce((s,f) => s+f.size, 0)/1e6;
      setStats({ duration, avg: totalMB/Math.max(.5, duration) });
      const id = setTimeout(() => setScreen('completed'), 1500);
      return () => clearTimeout(id);
    }
  }, [allDone, screen]);

  const anyActive = connected && files.some(f => f.status==='active' || f.status==='done');
  const copyAddr = () => {
    try { navigator.clipboard && navigator.clipboard.writeText(ADDRESS); } catch(e) {}
    setCopied(true); setTimeout(() => setCopied(false), 1800);
  };

  const phoneView = (
    <div className="phone">
      <div className="phone-screen">
        <div className="statusbar">
          <span>9:30</span>
          <span className="punch"/>
          <span className="sb-r">
            <Icon name="wifi" size={15} stroke={2.2}/>
            <svg width="22" height="13" viewBox="0 0 22 13" style={{ display:'block' }}>
              <rect x=".6" y=".6" width="18" height="11.8" rx="3" fill="none" stroke="currentColor" strokeWidth="1.3"/>
              <rect x="2.4" y="2.4" width="13" height="8.2" rx="1.6" fill="currentColor"/>
              <rect x="20" y="4" width="1.6" height="5" rx=".8" fill="currentColor"/>
            </svg>
          </span>
        </div>

        {toast && (
          <div className="toast">
            <div style={{ width:34, height:34, borderRadius:10, background:'rgba(255,255,255,.14)',
              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <Icon name={toast.icon} size={18}/>
            </div>
            <div style={{ flex:1 }}>
              <div className="t">{toast.t}</div>
              <div className="s">{toast.s}</div>
            </div>
          </div>
        )}

        {screen === 'home' && <HomeScreen onSelect={useDemoAndSelect}/>}
        {screen === 'selection' && <SelectionScreen files={files} onBack={() => setScreen('home')}
          onRemove={removeFile} onAddMore={goSelect} onStart={startSharing} dark={dark}/>}
        {screen === 'sharing' && <SharingScreen address={ADDRESS} files={files} clients={clients}
          anyActive={anyActive} allDone={allDone} onCopy={copyAddr} copied={copied}
          onStop={stopSharing} onPreviewPC={() => setView('desktop')} onConnect={doConnect} dark={dark}/>}
        {screen === 'completed' && <CompletedScreen files={files} durationSec={stats.duration}
          avgSpeed={stats.avg} onMore={() => { setFiles(DEMO_FILES.map(mkFile)); setScreen('selection'); }}
          onClose={() => { setFiles(DEMO_FILES.map(mkFile)); setScreen('home'); }}/>}

        <input ref={fileInput} type="file" multiple style={{ display:'none' }} onChange={onFilesPicked}/>
        <div className="navpill"><i/></div>
      </div>
    </div>
  );

  return (
    <div className="stage">
      <div className="stage-top">
        <div className="brandlock">
          <LogoMark size={34}/>
          <div>
            <div className="nm">DirectDrop</div>
            <div className="sub">Przesyłanie plików przez Wi-Fi · prototyp</div>
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div className="seg">
            <button className={view==='phone'?'on':''} onClick={() => setView('phone')}>
              <Icon name="phone" size={15}/> Telefon
            </button>
            <button className={view==='desktop'?'on':''} onClick={() => setView('desktop')}>
              <Icon name="monitor" size={15}/> Komputer
            </button>
          </div>
          <button className="iconbtn" onClick={() => setDark(d => !d)} title="Motyw">
            <Icon name={dark?'sun':'moon'} size={18}/>
          </button>
        </div>
      </div>
      <div className="stage-body">
        {view === 'phone' ? phoneView : <DesktopPage onBack={() => setView('phone')} dark={dark}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
